---
layout: default
---
<article class="article" id="top">
  <p class="eyebrow">{{ page.date | date: '%Y.%m.%d' }} · 文章</p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="article-lead">{{ page.description }}</p>{% endif %}
  {% if site.adsense_slot != "" %}
  <aside class="article-ad" aria-label="广告">
    <span class="ad-label">广告</span>
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="{{ site.adsense_client }}"
         data-ad-slot="{{ site.adsense_slot }}"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </aside>
  {% endif %}
  <div class="article-content">{{ content }}</div>
</article>
